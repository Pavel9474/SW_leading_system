<div id="modal-backdrop" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-40 flex items-center justify-center"
     onclick="document.getElementById('modal-backdrop').remove()">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 relative" onclick="event.stopPropagation()">
        <button type="button" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"
                onclick="document.getElementById('modal-backdrop').remove()">&times;</button>
        
        <h3 class="text-lg font-bold text-gray-900 mb-2">Прикрепить результат</h3>
        <p class="text-sm text-gray-500 mb-4">{{ output.name }}</p>
        
        <!-- УБРАЛИ onsubmit и ДОБАВИЛИ hx-on::after-request -->
        <form hx-post="{% url 'accounts:attach_output_file' output.id %}" 
              hx-encoding="multipart/form-data" 
              hx-target="#output-{{ output.id }}" 
              hx-swap="outerHTML"
              hx-on::after-request="document.getElementById('modal-backdrop').remove()">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Файл отчета</label>
                <input type="file" name="result_file" required
                       class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button type="button" onclick="document.getElementById('modal-backdrop').remove()"
                        class="px-4 py-2 bg-white border border-gray-300 rounded text-sm font-medium text-gray-700 hover:bg-gray-50">
                    Отмена
                </button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded text-sm font-medium hover:bg-indigo-700">
                    Загрузить и сдать
                </button>
            </div>
        </form>
    </div>
</div>
