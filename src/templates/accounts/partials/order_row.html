<div id="task-{{ task.id }}" class="flex items-center justify-between p-4 border border-gray-200 rounded-lg bg-gray-50">
    <div>
        <p class="font-medium text-gray-900">{{ task.title }}</p>
        <div class="flex items-center gap-2 mt-0.5">
            <span class="text-xs text-gray-500">
                {% if task.project %}Проект: {{ task.project.name }}{% endif %}
            </span>
            {% if task.status == 'submitted' %}
                <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800">На проверке</span>
            {% else %}
                <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800">В работе</span>
            {% endif %}
        </div>
    </div>
    
    {% if task.status == 'new' or task.status == 'in_progress' %}
    <!-- ДОБАВЛЕН hx-headers с CSRF-токеном -->
    <button hx-post="{% url 'accounts:submit_order' task.id %}" 
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-target="#task-{{ task.id }}" 
            hx-swap="outerHTML"
            class="bg-indigo-600 text-white text-xs font-semibold px-3 py-1.5 rounded hover:bg-indigo-700 transition">
        Сдать работу
    </button>
    {% else %}
    <span class="text-xs text-gray-400 font-medium">Ожидает решения</span>
    {% endif %}
</div>
