<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контроль загрузки подразделений</title>
    <!-- Подключаем Tailwind CSS для красивого интерфейса и HTMX для динамики -->
    <script src="[link removed]"></script>
    <script src="[link removed]"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Контроль загрузки подразделений</h1>
            <p class="text-gray-600 mt-2">Оперативный мониторинг распределения поручений и выходов НИР.</p>
        </header>

        <!-- Селектор выбора подразделения -->
        <div class="bg-white p-6 rounded-xl shadow-xs border border-gray-200 mb-6">
            <label for="department-select" class="block text-sm font-medium text-gray-700 mb-2">Выберите подразделение:</label>
            <select id="department-select" 
                    name="department_id" 
                    class="w-full md:w-80 p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500"
                    hx-get="/reporting/department-load-fragment/" 
                    hx-target="#load-data-container" 
                    hx-indicator="#loading-indicator">
                <option value="">-- Выберите из справочника --</option>
                {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                {% endfor %}
            </select>
            
            <!-- Индикатор загрузки -->
            <span id="loading-indicator" class="htmx-indicator text-sm text-blue-600 ml-4 animate-pulse">
                Сбор агрегированных данных...
            </span>
        </div>

        <!-- Контейнер для динамического контента от HTMX -->
        <div id="load-data-container">
            <div class="text-center p-12 text-gray-400 bg-white rounded-xl border border-dashed border-gray-300">
                Выберите подразделение из списка выше для отображения интегральных показателей нагрузки.
            </div>
        </div>
    </div>

</body>
</html>
