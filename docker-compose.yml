services:
  # СЕРВИС БАЗЫ ДАННЫХ POSTGRESQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    container_name: system_v1_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # СЕРВИС REDIS (БРОКЕР ДЛЯ CELERY БИТ И ОЧЕРЕДЕЙ)
  redis:
    image: redis:7-alpine
    container_name: system_v1_redis
    ports:
      - "6379:6379"

  # ОСНОВНОЕ DJANGO ПРИЛОЖЕНИЕ (БЭКЕНД И WEB)
  web:
    build: .
    container_name: system_v1_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --chdir /app/src
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - DJANGO_SETTINGS_MODULE=config.settings.local
    volumes:
      - ./src:/app/src
      - static_volume:/app/src/staticfiles
      - media_volume:/app/src/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ВОРКЕР CELERY ДЛЯ ФОНОВЫХ ЗАДАЧ (УВЕДОМЛЕНИЯ, СРОКИ)
  celery_worker:
    build: .
    container_name: system_v1_celery
    command: celery -A config.celery worker --loglevel=info
    working_dir: /app/src
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - DJANGO_SETTINGS_MODULE=config.settings.local
    volumes:
      - ./src:/app/src
      - static_volume:/app/src/staticfiles
      - media_volume:/app/src/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # СЕРВИС FLOWER ДЛЯ МОНИТОРИНГА CELERY
  flower:
      build: .
      container_name: system_v1_flower
      command: celery -A config.celery flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flower_secure_password}
      working_dir: /app/src
      env_file:
        - .env
      ports:
        - "5555:5555"
      environment:
        - PYTHONPATH=/app/src
        - CELERY_BROKER_URL=redis://redis:6379/0
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
        - REDIS_URL=redis://redis:6379/0
        - DJANGO_SETTINGS_MODULE=config.settings.local
      volumes:
        - ./src:/app/src
      depends_on:
        redis:
          condition: service_started
        web:
          condition: service_started

  # БОЕВОЙ ВЕБ-СЕРВЕР NGINX (ОТДАЧА СТАТИКИ И МАРШРУТИЗАЦИЯ)
  nginx:
    image: nginx:1.25-alpine
    container_name: system_v1_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/src/staticfiles
      - media_volume:/app/src/media
    depends_on:
      - web

# ОПРЕДЕЛЕНИЕ ОБЩИХ ТОМОВ (VOLUMES) ДЛЯ ВСЕХ КОНТЕЙНЕРОВ
volumes:
  static_volume:
  media_volume:
  postgres_data: