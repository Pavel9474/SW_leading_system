upstream django_server {
    server web:8000;
}

server {
    listen 80;
    server_name localhost; # Укажите домен института для продакшена

    # Отдаем статику напрямую, минуя Django
    location /static/ {
        alias /app/src/staticfiles/;
    }

    # Отдаем медиафайлы (документы)
    location /media/ {
        alias /app/src/media/;
    }

    # Все остальные запросы проксируем в Django
    location / {
        proxy_pass http://django_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}